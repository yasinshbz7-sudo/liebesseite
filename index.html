<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Für dich ❤️</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Dancing+Script:wght@600;700&family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<style>
  :root {
    --bg1: #2b0a1e;
    --bg2: #5c1237;
    --pink: #ff5c8a;
    --rose: #ffb3c7;
    --text: #fff5f8;
    --card: rgba(255, 255, 255, 0.08);
    --border: rgba(255, 179, 199, 0.25);
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { min-height: 100%; }
  body {
    font-family: "Poppins", system-ui, sans-serif;
    color: var(--text);
    background: radial-gradient(ellipse at top, var(--bg2), var(--bg1) 70%) fixed;
    overflow-x: hidden;
    text-align: center;
    padding: 48px 16px 80px;
  }
  #hearts { position: fixed; inset: 0; pointer-events: none; z-index: 0; overflow: hidden; }
  .float-heart {
    position: absolute; bottom: -40px;
    animation: rise linear forwards;
    opacity: 0.7;
  }
  @keyframes rise {
    to { transform: translateY(-115vh) rotate(25deg); opacity: 0; }
  }
  .burst {
    position: fixed; pointer-events: none; z-index: 50;
    animation: burst 0.9s ease-out forwards;
  }
  @keyframes burst {
    to { transform: translate(var(--dx), var(--dy)) scale(0.4); opacity: 0; }
  }
  main { position: relative; z-index: 1; max-width: 760px; margin: 0 auto; }

  .big-heart {
    font-size: 72px; display: inline-block;
    animation: beat 1.2s ease-in-out infinite;
    cursor: pointer; user-select: none;
  }
  @keyframes beat {
    0%, 100% { transform: scale(1); }
    15% { transform: scale(1.18); }
    30% { transform: scale(1); }
    45% { transform: scale(1.12); }
  }
  h1 {
    font-family: "Dancing Script", cursive;
    font-size: clamp(42px, 9vw, 72px);
    color: var(--rose);
    margin: 8px 0 4px;
    text-shadow: 0 0 24px rgba(255, 92, 138, 0.5);
  }
  .since { font-weight: 300; opacity: 0.85; margin-bottom: 36px; }

  .counter {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 12px;
    margin-bottom: 16px;
  }
  .unit {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 18px;
    padding: 18px 8px;
    backdrop-filter: blur(6px);
  }
  .unit .num {
    font-size: clamp(30px, 7vw, 46px);
    font-weight: 600;
    color: var(--pink);
    font-variant-numeric: tabular-nums;
    line-height: 1.1;
  }
  .unit .lbl { font-size: 13px; text-transform: uppercase; letter-spacing: 2px; opacity: 0.75; }

  .totals {
    display: flex; flex-wrap: wrap; justify-content: center; gap: 8px 20px;
    font-size: 14px; opacity: 0.85; margin-bottom: 48px;
  }
  .totals b { color: var(--rose); font-variant-numeric: tabular-nums; }

  section { margin-bottom: 48px; }
  h2 {
    font-family: "Dancing Script", cursive;
    font-size: 38px; color: var(--rose); margin-bottom: 16px;
  }

  .anniv {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 22px 16px;
  }
  .anniv .num { font-size: 40px; font-weight: 600; color: var(--pink); }
  .progress {
    height: 10px; border-radius: 99px; background: rgba(255,255,255,0.1);
    margin: 14px auto 6px; max-width: 420px; overflow: hidden;
  }
  .progress div {
    height: 100%; border-radius: 99px;
    background: linear-gradient(90deg, var(--rose), var(--pink));
    transition: width 1s;
  }

  .reason-box {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 18px; padding: 28px 20px; min-height: 120px;
    display: flex; align-items: center; justify-content: center;
    font-size: 20px; line-height: 1.5;
  }
  .reason-box.pop { animation: pop 0.4s ease; }
  @keyframes pop { 0% { transform: scale(0.92); opacity: 0; } 100% { transform: scale(1); opacity: 1; } }
  button {
    font: inherit; font-weight: 600;
    margin-top: 16px; padding: 12px 26px;
    border: none; border-radius: 99px; cursor: pointer;
    color: #fff;
    background: linear-gradient(135deg, var(--pink), #d6336c);
    box-shadow: 0 6px 20px rgba(255, 92, 138, 0.35);
    transition: transform 0.15s;
  }
  button:hover { transform: translateY(-2px); }
  button:active { transform: scale(0.97); }

  .milestones { display: grid; gap: 10px; text-align: left; }
  .ms {
    display: flex; justify-content: space-between; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 14px; padding: 12px 16px; font-size: 15px;
  }
  .ms.done { opacity: 0.55; }
  .ms .when { color: var(--rose); white-space: nowrap; }

  footer { opacity: 0.6; font-size: 14px; }

  @media (max-width: 480px) {
    .counter { grid-template-columns: repeat(3, 1fr); gap: 8px; }
    .unit { padding: 14px 4px; }
    .unit .lbl { font-size: 11px; letter-spacing: 1px; }
  }
</style>
</head>
<body>
<div id="hearts"></div>

<main>
  <div class="big-heart" id="bigHeart" title="Klick mich!">❤️</div>
  <h1>Wir zwei</h1>
  <p class="since">zusammen seit dem 10. Juni 2021</p>

  <div class="counter">
    <div class="unit"><div class="num" id="y">0</div><div class="lbl">Jahre</div></div>
    <div class="unit"><div class="num" id="mo">0</div><div class="lbl">Monate</div></div>
    <div class="unit"><div class="num" id="d">0</div><div class="lbl">Tage</div></div>
    <div class="unit"><div class="num" id="h">0</div><div class="lbl">Stunden</div></div>
    <div class="unit"><div class="num" id="mi">0</div><div class="lbl">Minuten</div></div>
    <div class="unit"><div class="num" id="s">0</div><div class="lbl">Sekunden</div></div>
  </div>
  <div class="totals">
    <span>insgesamt <b id="totalDays">0</b> Tage</span>
    <span><b id="totalHours">0</b> Stunden</span>
    <span><b id="totalSecs">0</b> Sekunden</span>
  </div>

  <section>
    <h2>Nächster Jahrestag</h2>
    <div class="anniv">
      <div>noch</div>
      <div class="num" id="annivDays">0</div>
      <div id="annivText">Tage bis zum Jahrestag</div>
      <div class="progress"><div id="annivBar" style="width:0%"></div></div>
    </div>
  </section>

  <section>
    <h2>Warum ich dich liebe</h2>
    <div class="reason-box" id="reason">Klick auf den Button 💌</div>
    <button id="reasonBtn">Noch ein Grund</button>
  </section>

  <section>
    <h2>Unsere Meilensteine</h2>
    <div class="milestones" id="milestones"></div>
  </section>

  <footer>Klick irgendwo hin für Herzen 💕</footer>
</main>

<script>
  const START = new Date(2021, 5, 10, 0, 0, 0); // 10.06.2021

  const $ = id => document.getElementById(id);
  const fmt = n => n.toLocaleString("de-DE");

  function addMonths(date, months) {
    const d = new Date(date);
    d.setMonth(d.getMonth() + months);
    return d;
  }

  function tick() {
    const now = new Date();

    // ganze Monate seit Start
    let months = (now.getFullYear() - START.getFullYear()) * 12 + (now.getMonth() - START.getMonth());
    if (addMonths(START, months) > now) months--;
    const anchor = addMonths(START, months);
    let rest = Math.floor((now - anchor) / 1000);

    const days = Math.floor(rest / 86400); rest -= days * 86400;
    const hours = Math.floor(rest / 3600); rest -= hours * 3600;
    const mins = Math.floor(rest / 60);
    const secs = rest - mins * 60;

    $("y").textContent = Math.floor(months / 12);
    $("mo").textContent = months % 12;
    $("d").textContent = days;
    $("h").textContent = hours;
    $("mi").textContent = mins;
    $("s").textContent = secs;

    const totalSecs = Math.floor((now - START) / 1000);
    $("totalDays").textContent = fmt(Math.floor(totalSecs / 86400));
    $("totalHours").textContent = fmt(Math.floor(totalSecs / 3600));
    $("totalSecs").textContent = fmt(totalSecs);

    // nächster Jahrestag
    let next = new Date(now.getFullYear(), 5, 10);
    if (next <= now) next = new Date(now.getFullYear() + 1, 5, 10);
    const prev = new Date(next.getFullYear() - 1, 5, 10);
    const daysLeft = Math.ceil((next - now) / 86400000);
    const yearNr = next.getFullYear() - START.getFullYear();
    $("annivDays").textContent = daysLeft;
    $("annivText").textContent = (daysLeft === 1 ? "Tag" : "Tage") + " bis zu unserem " + yearNr + ". Jahrestag";
    $("annivBar").style.width = ((now - prev) / (next - prev) * 100).toFixed(1) + "%";
  }
  tick();
  setInterval(tick, 1000);

  // Meilensteine
  const milestones = [
    { label: "100 Tage", days: 100 },
    { label: "500 Tage", days: 500 },
    { label: "1.000 Tage", days: 1000 },
    { label: "1.500 Tage", days: 1500 },
    { label: "2.000 Tage", days: 2000 },
    { label: "2.500 Tage", days: 2500 },
    { label: "3.000 Tage", days: 3000 },
  ];
  const msBox = $("milestones");
  const today = new Date();
  milestones.forEach(m => {
    const date = new Date(START);
    date.setDate(date.getDate() + m.days);
    const done = date <= today;
    const el = document.createElement("div");
    el.className = "ms" + (done ? " done" : "");
    el.innerHTML = `<span>${done ? "✅" : "⏳"} ${m.label} zusammen</span>
      <span class="when">${date.toLocaleDateString("de-DE")}</span>`;
    msBox.appendChild(el);
  });

  // Gründe
  const reasons = [
    "Weil dein Lachen meinen ganzen Tag besser macht 😊",
    "Weil ich bei dir einfach ich selbst sein kann",
    "Weil du immer für mich da bist, egal was ist",
    "Weil jeder Moment mit dir besonders ist ✨",
    "Weil du mich jeden Tag ein bisschen besser machst",
    "Weil ich mit dir über alles reden kann",
    "Weil du mein Zuhause bist 🏡",
    "Weil wir zusammen die besten Erinnerungen haben",
    "Weil du einfach wunderschön bist – innen und außen",
    "Weil ich mir keine Zukunft ohne dich vorstellen kann 💍",
  ];
  let lastReason = -1;
  $("reasonBtn").addEventListener("click", () => {
    let i;
    do { i = Math.floor(Math.random() * reasons.length); } while (i === lastReason);
    lastReason = i;
    const box = $("reason");
    box.classList.remove("pop"); void box.offsetWidth; box.classList.add("pop");
    box.textContent = reasons[i];
  });

  // fliegende Herzen im Hintergrund
  const heartEmojis = ["❤️", "💕", "💖", "💗", "💓", "🩷"];
  function spawnFloatingHeart() {
    const el = document.createElement("span");
    el.className = "float-heart";
    el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
    el.style.left = Math.random() * 100 + "vw";
    el.style.fontSize = 14 + Math.random() * 22 + "px";
    el.style.animationDuration = 7 + Math.random() * 6 + "s";
    $("hearts").appendChild(el);
    el.addEventListener("animationend", () => el.remove());
  }
  setInterval(spawnFloatingHeart, 500);

  // Herz-Explosion beim Klicken
  function burst(x, y, count = 12) {
    for (let i = 0; i < count; i++) {
      const el = document.createElement("span");
      el.className = "burst";
      el.textContent = heartEmojis[Math.floor(Math.random() * heartEmojis.length)];
      const angle = (Math.PI * 2 * i) / count;
      const dist = 60 + Math.random() * 60;
      el.style.left = x - 10 + "px";
      el.style.top = y - 10 + "px";
      el.style.fontSize = 14 + Math.random() * 12 + "px";
      el.style.setProperty("--dx", Math.cos(angle) * dist + "px");
      el.style.setProperty("--dy", Math.sin(angle) * dist + "px");
      document.body.appendChild(el);
      el.addEventListener("animationend", () => el.remove());
    }
  }
  document.addEventListener("click", e => burst(e.clientX, e.clientY));
  $("bigHeart").addEventListener("click", e => {
    e.stopPropagation();
    const r = e.target.getBoundingClientRect();
    burst(r.left + r.width / 2, r.top + r.height / 2, 30);
  });
</script>
</body>
</html>
